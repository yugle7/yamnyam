<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; padding: 0; background: #f7f6f4; }
    iframe { display: block; width: 400px; height: 800px; border: 0; }
</style>
</head>
<body>
<iframe id="app" src="index.html"></iframe>
<script>
document.getElementById("app").addEventListener("load", (e) => {
    const w = e.target.contentWindow;
    w.eval(`
        openMeal(newMeal(), true);
        meal.items.push(makeItem(REFS[0], 150, "manual"));
        renderItems();
        openPortion(0);
    `);
});
</script>
</body>
</html>
